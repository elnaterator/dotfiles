# Skills Configuration
# Enable or disable individual skills by setting enabled = true/false
# When a skill is disabled, setup.sh will remove its symlink from ~/.claude/skills/

[write-like-me]
enabled = true
description = "Drafts and edits prose in your personal writing voice"

[worklog]
enabled = true
description = "Captures weekly accomplishments and produces an impact-focused summary email"

[project-bootstrapper]
enabled = true
description = "Scaffolds/upgrades projects to standard layout (docs, Makefiles, optional Terraform infra)"

[jira]
enabled = true
description = "Day-to-day Jira via the jira CLI, non-interactive (list, view, create, edit, move, comment)"
