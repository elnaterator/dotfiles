version: "2"

linters:
  default: standard
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec      # security (SAST)
    - revive     # style / best practices
    - bodyclose
    - misspell

formatters:
  enable:
    - gofumpt    # stricter gofmt
    - goimports  # group + fix imports
